
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
#gw{font-family:'Press Start 2P',monospace;background:#060d1f;width:100%;display:flex;flex-direction:column;align-items:center;}
#hud{display:flex;gap:24px;padding:8px 16px;font-size:9px;color:#7ef7a8;letter-spacing:1px;width:100%;justify-content:center;background:#060d1f;flex-wrap:wrap;}
#hud span{color:#fff}
#wrap{position:relative;width:100%}
#canvas{display:block;width:100%}
#overlay{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(6,13,31,0.88);z-index:10;}
#overlay h1{font-size:18px;color:#7ef7a8;margin-bottom:14px;text-shadow:0 0 10px #7ef7a860;}
#overlay p{font-size:9px;color:#8ab4f8;margin-bottom:8px;text-align:center;max-width:300px;line-height:2;}
.final{font-size:11px!important;color:#ffdd57!important;margin-bottom:6px!important;}
#sbtn{margin-top:16px;font-family:'Press Start 2P',monospace;font-size:10px;background:#7ef7a8;color:#060d1f;border:none;padding:10px 24px;border-radius:4px;cursor:pointer;letter-spacing:1px;}
#sbtn:hover{background:#5cd48a}
</style>
<div id="gw">
  <div id="hud">
    <div>SCORE: <span id="sv">0</span></div>
    <div>LIVES: <span id="lv">❤️❤️❤️</span></div>
    <div>LEVEL: <span id="lvl">1</span></div>
  </div>
  <div id="wrap">
    <canvas id="canvas"></canvas>
    <div id="overlay">
      <h1>🗑️ TRASHY</h1>
      <p>Catch falling trash before it hits the ground!</p>
      <p>← → keys or mouse/touch to move</p>
      <p>💀 dodge skulls &nbsp;|&nbsp; ⭐ = 50pts &nbsp;|&nbsp; combos = double pts</p>
      <div id="fs" style="display:none" class="final"></div>
      <button id="sbtn">START GAME</button>
    </div>
  </div>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const W = 580;
const H = 680;
canvas.width = W;
canvas.height = H;

const CAN_W = 64, CAN_H = 52;
const GROUND = H - 20;

let state = 'idle';
let score, lives, level, combo, comboTimer, frameCount;
let trashList, particles, stars;
let canX = W/2 - CAN_W/2;
let squishF = 0;
let animId;
const keys = {};

const TRASH = [
  {emoji:'🗞️',w:28,h:28,pts:10},{emoji:'🍌',w:30,h:30,pts:10},
  {emoji:'🥫',w:26,h:30,pts:15},{emoji:'🧴',w:24,h:34,pts:15},
  {emoji:'🍕',w:32,h:30,pts:10},{emoji:'📦',w:30,h:28,pts:20},
  {emoji:'🎃',w:32,h:32,pts:25},{emoji:'💀',w:30,h:30,pts:-30,bad:true},
  {emoji:'⭐',w:28,h:28,pts:50,bonus:true},
];

function initStars() {
  stars=[];
  for(let i=0;i<70;i++) stars.push({x:Math.random()*W,y:Math.random()*(H*0.75),r:Math.random()*1.3+0.3,tw:Math.random()*Math.PI*2});
}

function startGame() {
  score=0;lives=3;level=1;combo=0;comboTimer=0;frameCount=0;
  trashList=[];particles=[];
  canX=W/2-CAN_W/2;
  state='playing';
  document.getElementById('overlay').style.display='none';
  loop();
}

function spawnTrash() {
  const t=TRASH[Math.floor(Math.random()*TRASH.length)];
  const x=36+Math.random()*(W-72);
  const speed=1.6+(level-1)*0.38+Math.random()*1.1;
  trashList.push({...t,x,y:-40,speed,rot:(Math.random()-0.5)*0.08,angle:0});
}

function emitParticles(x,y,color,count,bonus) {
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2,sp=1.5+Math.random()*3.5;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,decay:0.02+Math.random()*0.02,r:3+Math.random()*4,color:bonus?`hsl(${Math.random()*60+40},100%,60%)`:color});
  }
}

function drawBg() {
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#050c1c');sky.addColorStop(1,'#0e1f3d');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  const t=Date.now()/1000;
  stars.forEach(s=>{
    const a=0.35+0.55*Math.sin(s.tw+t*1.2);
    ctx.fillStyle=`rgba(255,255,255,${a})`;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
  });

  const bldgs=[[0,300,60],[70,280,80],[160,320,50],[220,260,70],[300,310,55],[365,275,65],[440,300,60],[510,265,70]];
  ctx.fillStyle='#0b1826';
  bldgs.forEach(([x,y,w])=>ctx.fillRect(x,y,w,GROUND-y));
  ctx.fillStyle='rgba(255,220,80,0.11)';
  bldgs.forEach(([x,y,w])=>{
    for(let wy=y+10;wy<GROUND-12;wy+=16)
      for(let wx=x+6;wx<x+w-6;wx+=12)
        if(Math.sin(wx*7+wy*3)>0.15) ctx.fillRect(wx,wy,6,8);
  });

  ctx.fillStyle='#162816';ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle='#223a22';ctx.fillRect(0,GROUND,W,4);
}

function drawCan(x,y,squish) {
  ctx.save();
  if(squish){ctx.translate(x+CAN_W/2,y+CAN_H);ctx.scale(1.13,0.87);ctx.translate(-(x+CAN_W/2),-(y+CAN_H));}
  ctx.fillStyle='#a8b8c8';ctx.fillRect(x+6,y+10,CAN_W-12,4);
  ctx.fillStyle='#c0d0df';
  ctx.beginPath();ctx.moveTo(x+8,y);ctx.lineTo(x+CAN_W-8,y);ctx.lineTo(x+CAN_W-12,y+10);ctx.lineTo(x+12,y+10);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#8a9aaa';ctx.lineWidth=1;ctx.stroke();
  const gr=ctx.createLinearGradient(x,0,x+CAN_W,0);
  gr.addColorStop(0,'#3a7a3a');gr.addColorStop(0.3,'#5ab45a');gr.addColorStop(0.7,'#4a9a4a');gr.addColorStop(1,'#2a5a2a');
  ctx.fillStyle=gr;
  ctx.beginPath();ctx.moveTo(x+6,y+14);ctx.lineTo(x+CAN_W-6,y+14);ctx.lineTo(x+CAN_W-2,y+CAN_H);ctx.lineTo(x+2,y+CAN_H);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#1a4a1a';ctx.lineWidth=1.2;ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.09)';
  for(let i=0;i<4;i++) ctx.fillRect(x+10+i*13,y+16,6,CAN_H-18);
  const fy=y+26;
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.ellipse(x+20,fy,6,7,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(x+44,fy,6,7,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#111';
  ctx.beginPath();ctx.ellipse(x+21,fy,3,4,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(x+45,fy,3,4,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#111';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(x+CAN_W/2,fy+4,9,0.1*Math.PI,0.9*Math.PI);ctx.stroke();
  ctx.fillStyle='#2a5a2a';
  ctx.beginPath();ctx.ellipse(x+12,y+CAN_H+3,8,4,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(x+CAN_W-12,y+CAN_H+3,8,4,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawTrash(t) {
  ctx.save();
  ctx.translate(t.x,t.y);ctx.rotate(t.angle);
  ctx.font=`${t.w}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  if(t.bonus){ctx.shadowColor='#ffdd57';ctx.shadowBlur=14;}
  ctx.fillText(t.emoji,0,0);
  ctx.restore();
}

function loop() {
  if(state!=='playing') return;
  frameCount++;
  ctx.clearRect(0,0,W,H);
  drawBg();

  const spd=5.5;
  if((keys['ArrowLeft']||keys['a'])&&canX>0) canX-=spd;
  if((keys['ArrowRight']||keys['d'])&&canX<W-CAN_W) canX+=spd;

  const rate=Math.max(34,92-(level-1)*12);
  if(frameCount%rate===0) spawnTrash();
  if(frameCount%430===0) level++;

  const canTop=GROUND-CAN_H-6;
  for(let i=trashList.length-1;i>=0;i--){
    const t=trashList[i];
    t.y+=t.speed;t.angle+=t.rot;
    if(!t.caught&&t.y+t.h/2>canTop&&t.y-t.h/2<canTop+18&&t.x>canX+6&&t.x<canX+CAN_W-6){
      t.caught=true;squishF=8;
      if(t.bad){lives--;combo=0;comboTimer=0;emitParticles(t.x,t.y,'#ff4444',18,false);if(lives<=0){endGame();return;}}
      else{combo++;comboTimer=60;score+=t.pts*(combo>=3?2:1);emitParticles(t.x,t.y,t.bonus?'#ffdd57':'#7ef7a8',t.bonus?30:14,t.bonus);}
      trashList.splice(i,1);continue;
    }
    if(t.y>GROUND+30){
      if(!t.bad&&!t.bonus){lives--;combo=0;comboTimer=0;emitParticles(t.x,GROUND,'#ff8844',10,false);if(lives<=0){endGame();return;}}
      trashList.splice(i,1);continue;
    }
    if(!t.caught) drawTrash(t);
  }

  const sq=squishF>0;if(squishF>0)squishF--;
  drawCan(canX,canTop,sq);

  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life-=p.decay;
    if(p.life<=0){particles.splice(i,1);continue;}
    ctx.save();ctx.globalAlpha=p.life;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fill();ctx.restore();
  }

  if(comboTimer>0)comboTimer--;
  if(combo>=2&&comboTimer>0){
    const a=Math.min(1,comboTimer/20);
    ctx.save();ctx.globalAlpha=a;ctx.font='bold 12px "Press Start 2P",monospace';
    ctx.fillStyle='#ffdd57';ctx.textAlign='center';
    ctx.fillText(`${combo}x COMBO!`,W/2,44);ctx.restore();
  }

  document.getElementById('sv').textContent=score;
  document.getElementById('lv').textContent='❤️'.repeat(Math.max(0,lives));
  document.getElementById('lvl').textContent=level;

  animId=requestAnimationFrame(loop);
}

function endGame() {
  state='over';cancelAnimationFrame(animId);
  const ov=document.getElementById('overlay');
  ov.style.display='flex';
  ov.querySelector('h1').textContent='💀 GAME OVER';
  document.getElementById('fs').style.display='block';
  document.getElementById('fs').textContent=`FINAL SCORE: ${score}`;
  document.getElementById('sbtn').textContent='PLAY AGAIN';
  ov.querySelectorAll('p').forEach(p=>p.style.display='none');
}

document.getElementById('sbtn').addEventListener('click',()=>{cancelAnimationFrame(animId);startGame();});
document.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();});
document.addEventListener('keyup',e=>{keys[e.key]=false;});

canvas.addEventListener('mousemove',e=>{
  if(state!=='playing') return;
  const r=canvas.getBoundingClientRect();
  canX=Math.min(W-CAN_W,Math.max(0,(e.clientX-r.left)*(W/r.width)-CAN_W/2));
});
canvas.addEventListener('touchmove',e=>{
  if(state!=='playing') return;e.preventDefault();
  const r=canvas.getBoundingClientRect();
  canX=Math.min(W-CAN_W,Math.max(0,(e.touches[0].clientX-r.left)*(W/r.width)-CAN_W/2));
},{passive:false});

initStars();
(function idle(){if(state!=='idle')return;ctx.clearRect(0,0,W,H);drawBg();drawCan(W/2-CAN_W/2,GROUND-CAN_H-6,false);requestAnimationFrame(idle);})();
</script>
